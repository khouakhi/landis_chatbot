[project]
name = "landis-chatbot-workspace"
version = "0.1.0"
description = "LandIS Open Soils assistant — RAG chatbot and corpus pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/landis",
    "apps/admin",
    "apps/api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
