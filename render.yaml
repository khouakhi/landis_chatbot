# Render blueprint — LandIS assistant API and Postgres 16 (pgvector).
# Dashboard: New > Blueprint, and connect the landis_chatbot repository.
# The repository root for Render is this code folder.
#
# Ingest and OCR stay on a laptop, using the external database URL.
# Set MISTRAL_API_KEY in the Render dashboard. Do not put it in this file.
# Optional: set LANDIS_BASIC_USER and LANDIS_BASIC_PASSWORD before sharing the URL.

services:
  - type: web
    name: landis-chatbot-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: MISTRAL_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: landis-postgres
          property: connectionString
      - key: LOG_CONVERSATIONS
        value: "true"
      - key: CONVERSATION_RETENTION_DAYS
        value: "365"
      - key: CHAT_HISTORY_ENABLED
        value: "true"

databases:
  - name: landis-postgres
    plan: starter
    databaseName: landis
    user: landis
    postgresMajorVersion: "16"
    ipAllowList: []
