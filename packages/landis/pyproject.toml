[project]
name = "landis"
version = "0.1.0"
description = "LandIS RAG library: Mistral OCR, corpus register, pgvector retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "mistralai>=3.6,<4",
    "numpy>=1.26.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landis"]

[tool.hatch.build.targets.sdist]
packages = ["src/landis"]
