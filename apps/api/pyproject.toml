[project]
name = "landis-api"
version = "0.1.0"
description = "LandIS assistant HTTP API"
requires-python = ">=3.11,<3.14"
dependencies = [
    "landis",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.uv.sources]
landis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "routes"]
